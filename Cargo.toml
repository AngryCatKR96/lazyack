[package]
name = "lazyack"
version = "0.1.3"
edition = "2024"
description = "Global hotkey to approve AI coding agent prompts without switching focus."
license = "MIT"
repository = "https://github.com/AngryCatKR96/lazyack"
homepage = "https://github.com/AngryCatKR96/lazyack"
readme = "README.md"
keywords = ["cli", "hotkey", "agent", "cmux", "tmux"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
global-hotkey = "0.7.0"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tao = "0.35.0"
